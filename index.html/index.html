<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Página de teste do site da Chapa do Grêmio.">
  <title>Chapa do Grêmio | Teste online</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #06111f; color: #f7fbff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #12365c 0, #06111f 55%, #030812 100%); }
    main { width: min(100%, 620px); padding: clamp(32px, 8vw, 72px) clamp(24px, 7vw, 64px); text-align: center; border: 1px solid rgba(255,255,255,.16); border-radius: 28px; background: rgba(9,26,46,.78); box-shadow: 0 24px 80px rgba(0,0,0,.35); }
    .badge { display: inline-block; padding: 8px 14px; border-radius: 999px; color: #8ed7ff; background: rgba(45,164,255,.13); font-size: .85rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 24px 0 12px; font-size: clamp(2rem, 7vw, 4rem); line-height: 1.05; }
    p { margin: 0; color: #b9c9d8; font-size: clamp(1rem, 2vw, 1.2rem); line-height: 1.6; }
    .status { margin-top: 28px; color: #8df0b5; font-weight: 700; }
    .dot { display: inline-block; width: 10px; height: 10px; margin-right: 8px; border-radius: 50%; background: #52e58a; box-shadow: 0 0 16px #52e58a; }
    footer { margin-top: 42px; color: #71869a; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <span class="badge">Chapa do Grêmio</span>
    <h1>O link está funcionando!</h1>
    <p>Esta é uma página de teste publicada para validar o acesso pelo link da Vercel e pelo QR code.</p>
    <div class="status"><span class="dot"></span>Site online</div>
    <footer>Em breve, novidades da nossa chapa.</footer>
  </main>
</body>
</html>
